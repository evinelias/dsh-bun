name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  bun-ci:
    name: Bun Monorepo CI & Boot Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Typert Artifacts
        run: bun scripts/generate-typert.ts

      - name: Verify Kernel & Elysia Boot
        run: bun run scripts/test-boot.ts

      - name: Compile Standalone CLI Binary
        run: bun run build:binary

      - name: Verify Compiled Binary Execution
        run: ./dist/dsh-bun --help
