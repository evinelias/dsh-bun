name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verification-matrix:
    name: Verification Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify Kernel, Plugins & Subsystems Suite
        run: bun run test:plugins

      - name: Build Web UI Frontend
        run: bun run build:web

      - name: Compile Standalone CLI Binary
        run: bun run build:binary

      - name: Verify Clean-Machine Standalone Binary (10-Step E2E)
        run: bun run test:clean-binary
