name: Release Build (Bun Sidecar + Tauri v2)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows x64 (.msi & -setup.exe)
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
            ext: .exe

          # 2. macOS Apple Silicon ARM64 (.dmg & .app)
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            bun_target: bun-darwin-aarch64
            ext: ""

          # 3. macOS Intel x64 (.dmg & .app — cross-compiled on ARM runner)
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
            ext: ""

          # 4. Linux x64 (.AppImage & .deb)
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKitGTK & Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust Build Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install monorepo dependencies
        run: bun install

      - name: Build Web UI & Compile Target-Specific Bun Sidecar
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.rust_target }}
          BUN_TARGET: ${{ matrix.bun_target }}
          EXT: ${{ matrix.ext }}
        run: |
          bun run build:sidecar

      - name: Build Tauri v2 Installers & Upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "DeepSeek Harness (Bun Edition) ${{ github.ref_name }}"
          releaseBody: |
            ## DeepSeek Harness — Native Bun + Elysia + Tauri v2 Edition (${{ github.ref_name }})
            Zero Node.js. Zero Electron. Powered by Bun, Elysia, Cordis, and Tauri v2.

            ### Downloads
            - **Windows (x64):** `.msi` or `-setup.exe` (plus standalone `dsh-bun-windows-x64.exe` CLI)
            - **macOS (Apple Silicon):** `_aarch64.dmg`
            - **macOS (Intel):** `_x64.dmg`
            - **Linux (x64):** `.AppImage` or `.deb`
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.rust_target }}

      - name: Upload Standalone Headless CLI Binary and Ripgrep to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ./apps/desktop/src-tauri/binaries/dsh-bun-${{ matrix.rust_target }}${{ matrix.ext }} ./dsh-bun-${{ matrix.rust_target }}${{ matrix.ext }}
          gh release upload ${{ github.ref_name }} ./dsh-bun-${{ matrix.rust_target }}${{ matrix.ext }} --clobber
          if [ -f "./apps/desktop/src-tauri/binaries/rg${{ matrix.ext }}" ]; then
            cp ./apps/desktop/src-tauri/binaries/rg${{ matrix.ext }} ./rg-${{ matrix.rust_target }}${{ matrix.ext }}
            gh release upload ${{ github.ref_name }} ./rg-${{ matrix.rust_target }}${{ matrix.ext }} --clobber
          fi
