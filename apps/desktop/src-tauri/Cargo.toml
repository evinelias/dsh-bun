[package]
name = "dsh-desktop"
version = "0.2.1"
description = "DeepSeek Harness Desktop (Bun + Elysia + Tauri v2)"
authors = ["DeepSeek AI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
